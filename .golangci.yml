version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - containedctx
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true

    staticcheck:
      checks:
        - all
        - -ST1000

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/we1lman/tcpscan
